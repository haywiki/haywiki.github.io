        lineWidth: 2
      }
    },
    tooltip: {
      xDateFormat: '%B %Y',
      shared: true,
      pointFormatter: function() {
        const name = this.series.name;
        const v = signFmt(this.y);
        return '<span style="color:'+this.color+'">●</span> '+name+': <b>'+v+'</b><br/>';
      }
    },
    legend: {
      enabled: true,
      align: 'center', verticalAlign: 'bottom',
      itemStyle: {fontSize:'10px',fontWeight:'500',color:'#1f2328'}
    },
    series: [
      {
        name: 'Месячное сальдо',
        type: 'column',
        yAxis: 0,
        data: barData,
        color: posColor,
        negativeColor: negColor,
        zIndex: 1
      },
      {
        name: 'Накопительное',
        type: 'line',
        yAxis: 1,
        data: lineData,
        color: '#8250df',
        lineWidth: 2,
        zIndex: 5,
        marker: {enabled: false}
      }
    ]
  });
}

// Build grid
const grid = document.getElementById('grid');
TOP20.forEach((country, idx) => {
  const pts = RAW[country];
  const cum = pts[pts.length - 1].cum;
  const cumCls = cum >= 0 ? 'pos' : 'neg';
  const id = 'chart_' + idx;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML =
    '<h2>' + country +
    '<span class="cum ' + cumCls + '">' + signFmt(cum) + '</span></h2>' +
    '<div id="' + id + '" class="chart"></div>';
  grid.appendChild(card);
  makeChart(country, id);
});
</script>
</body>
</html>
